name: "Code Review Bot"

on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    uses: lararosekelley/review-bot/.github/workflows/review.yml@git-stk-eval
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
